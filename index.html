<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>TheMeteo — Static Documents Server</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      background-color: #f8fafc;
      color: #0f172a;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      .card {
        background-color: #1e293b !important;
        border-color: #334155 !important;
      }
      p {
        color: #cbd5e1 !important;
      }
    }
    .card {
      max-width: 520px;
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 9999px;
      background-color: rgba(56, 189, 248, 0.15);
      color: #0284c7;
      margin-bottom: 16px;
    }
    @media (prefers-color-scheme: dark) {
      .badge {
        color: #38bdf8;
      }
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 12px 0;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #475569;
      margin: 0;
    }
    a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 500;
    }
    @media (prefers-color-scheme: dark) {
      a {
        color: #38bdf8;
      }
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Static Assets &amp; API</span>
    <h1>TheMeteo App Resources</h1>
    <p>
      This repository contains legal and additional server documents necessary for the proper functioning of the <strong>TheMeteo</strong> app. 
      The content of this repository is mirrored to <a href="https://themeteodocs.19374629.xyz">themeteodocs.19374629.xyz</a>.
    </p>
  </main>
</body>
</html>
